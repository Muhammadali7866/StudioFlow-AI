apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: studioflow-api
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: us-central1-docker.pkg.dev/studioflow-ai-dev/studioflow/api:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: GOOGLE_CLOUD_PROJECT_ID
              value: studioflow-ai-dev
            - name: GOOGLE_CLOUD_REGION
              value: us-central1
            - name: FIRESTORE_DATABASE_ID
              value: "(default)"
            - name: GOOGLE_CLOUD_STORAGE_BUCKET
              value: studioflow-ai-media-dev
            - name: FIREBASE_PROJECT_ID
              value: studioflow-ai-dev
            - name: AUTH_ENABLED
              value: "true"
            - name: ALLOWED_ORIGINS
              value: "https://studioflow.vercel.app,https://studioflow-ai.vercel.app"
            - name: GEMINI_MODEL
              value: gemini-2.5-flash
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: GEMINI_API_KEY
                  key: latest
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
